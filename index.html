<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertretung Germann 17.09.2026</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      line-height: 1.6;
    }
    .klasse-bereich {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background-color: #f9f9f9;
    }
    select {
      font-size: 16px;
      padding: 6px 12px;
      margin-top: 10px;
    }
    ul {
      margin-top: 10px;
    }
    li {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- Große Überschrift -->
  <h1>Vertretung Germann 17.09.2026</h1>

  <label for="klasseSelect"><strong>Bitte Klasse auswählen:</strong></label><br>
  <select id="klasseSelect" onchange="zeigeMaterial()">
    <option value="">-- Klasse wählen --</option>
    <option value="klasse5">5cR & 5dR</option>
    <option value="klasse9">9aR</option>
  </select>

  <!-- Bereich für 5cR & 5dR -->
  <div id="klasse5" class="klasse-bereich">
    <h2>Materialien für die Klassen 5cR & 5dR</h2>
    <ul>
      <li>
        <a href="aufgaben_sv.pdf" download>Aufgaben der SV herunterladen (PDF)</a>
      </li>
      <li>
        <a href="sv_text.pdf" download>Basistext (PDF)</a>
      </li>
    </ul>
  </div>

  <!-- Bereich für 9aR -->
  <div id="klasse9" class="klasse-bereich">
    <h2>Materialien für die Klasse 9aR</h2>
    <ul>
      <li>
        <a href="powi_wiederholung.pdf" download>PoWi-Wiederholung herunterladen (PDF)</a>
      </li>
    </ul>
  </div>

  <!-- JavaScript für die Auswahlsteuerung -->
  <script>
    function zeigeMaterial() {
      // Beide Bereiche zunächst ausblenden
      document.getElementById('klasse5').style.display = 'none';
      document.getElementById('klasse9').style.display = 'none';

      // Gewählte Option abfragen und entsprechenden Bereich anzeigen
      const gewaehlt = document.getElementById('klasseSelect').value;
      if (gewaehlt) {
        document.getElementById(gewaehlt).style.display = 'block';
      }
    }
  </script>

</body>
</html>
